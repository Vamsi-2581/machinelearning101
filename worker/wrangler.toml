name = "ml-platform-auth-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "ml-platform-db"
database_id = "" # Will be set after creating the database

# Environment variables (secrets should be set via wrangler secret put)
[vars]
# FRONTEND_URL will be set per environment

# Development environment
[env.development]
vars = { FRONTEND_URL = "http://localhost:3000" }

# Production environment
[env.production]
# Set FRONTEND_URL via wrangler secret or vars for production
